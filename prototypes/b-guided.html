<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype B · Guided capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a phone frame with side notes on wide screens; at ≤440px the frame drops away and the app fills the screen. */
:root{
  --bg:#e7ece9;--paper:#f7f9f7;--card:#ffffff;--ink:#15201d;--mute:#5a6964;--line:#cdd7d3;--soft:#e4ebe8;
  --accent:#0d6a5b;--accent-ink:#ffffff;--accent-soft:#d7ebe5;
  --note-bg:#ecf0fb;--note-line:#a9b5e3;--note-ink:#2f3c78;
  --bar:#15201d;--bar-ink:#d9e3df;--bar-mute:#8fa19a;--bar-line:#3a4844;
  --ok:#2a7a4c;--ok-soft:#dcefe3;--fuzzy:#8f5f00;--fuzzy-soft:#f6ebd2;--forgot:#a63c39;--forgot-soft:#f6dedd;
  --shadow:rgba(21,32,29,.10);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1210;--paper:#131b18;--card:#1b2622;--ink:#e6eeeb;--mute:#97a8a1;--line:#2e3c37;--soft:#22302b;
  --accent:#55bfa9;--accent-ink:#06211c;--accent-soft:#1e3b34;
  --note-bg:#1d2338;--note-line:#46528a;--note-ink:#bcc6f0;
  --bar:#070b0a;--bar-ink:#d9e3df;--bar-mute:#7f918a;--bar-line:#2b3733;
  --ok:#6fcf97;--ok-soft:#1d3528;--fuzzy:#e2b45a;--fuzzy-soft:#3a2f17;--forgot:#f08a85;--forgot-soft:#3d2120;
  --shadow:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1210;--paper:#131b18;--card:#1b2622;--ink:#e6eeeb;--mute:#97a8a1;--line:#2e3c37;--soft:#22302b;
  --accent:#55bfa9;--accent-ink:#06211c;--accent-soft:#1e3b34;
  --note-bg:#1d2338;--note-line:#46528a;--note-ink:#bcc6f0;
  --bar:#070b0a;--bar-ink:#d9e3df;--bar-mute:#7f918a;--bar-line:#2b3733;
  --ok:#6fcf97;--ok-soft:#1d3528;--fuzzy:#e2b45a;--fuzzy-soft:#3a2f17;--forgot:#f08a85;--forgot-soft:#3d2120;
  --shadow:rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{font:15px/1.5 var(--f-body);background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);color:var(--bar-ink);font:12px/1.2 var(--f-mono);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center}
.proto a{color:var(--bar-mute);text-decoration:none;white-space:nowrap}
.proto .name{color:var(--bar-ink);font-weight:600;white-space:nowrap}
.proto .tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.proto .tabs::-webkit-scrollbar{display:none}
.proto button{background:transparent;color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap;font:inherit}
.proto button.on{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
.proto .opts{display:flex;gap:6px}
@media (max-width:700px){.proto{flex-wrap:wrap}.proto .tabs{order:3;flex-basis:100%}.proto .opts{margin-left:auto}}
@media (max-width:480px){.proto .long{display:none}}

/* stage */
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:392px;max-width:100%;height:800px;background:var(--card);border:2px solid var(--ink);border-radius:42px;padding:12px;box-shadow:0 14px 40px var(--shadow);flex-shrink:0}
.phone-in{height:100%;border-radius:30px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{display:flex;justify-content:space-between;padding:10px 24px 2px;font:600 12px var(--f-mono);color:var(--mute)}
#app{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.side{width:300px;min-width:0;position:sticky;top:80px}
.side h3{font:700 13px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 8px}
.side p{margin:0 0 12px;font-size:14px;color:var(--ink)}
@media (max-width:820px){.side{display:none}}
@media (max-width:440px){
  .stage{padding:0;display:block}
  .phone{width:100%;height:auto;min-height:calc(100dvh - 96px);border:none;border-radius:0;padding:0;box-shadow:none}
  .phone-in{border-radius:0;overflow:visible;min-height:calc(100dvh - 96px)}
  .status{display:none}
  #app{overflow:visible}
}

/* shared app pieces */
.pad{padding:8px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px}
.hdr h1{font:750 26px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.date{font:600 12px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.q{font:750 27px/1.15 var(--f-display);letter-spacing:-.02em;margin:4px 0 6px;text-wrap:balance}
.kicker{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
.muted{color:var(--mute)}
.sub{color:var(--mute);font-size:14px;margin:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hi{border-color:var(--accent)}
.card h2{font:700 17px/1.25 var(--f-body);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-weight:650;cursor:pointer;min-height:50px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{min-height:38px;padding:8px 12px;border-radius:11px;font-size:14px}
.btn.link{border:none;background:none;color:var(--accent);min-height:0;padding:6px 4px;font-weight:600}
.btn.wide{width:100%}
.btn.continue{justify-content:space-between;text-align:left;background:var(--accent-soft);border-color:var(--accent-soft);padding:16px 18px}
.btn.continue small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px;text-align:left}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.ok.on{background:var(--ok);border-color:var(--ok);color:var(--paper)}
label.lbl{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-top:4px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card);font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:96px;line-height:1.45}
.fnote{font:11.5px/1.5 var(--f-mono);font-variant-ligatures:none;background:var(--note-bg);border:1px dashed var(--note-line);color:var(--note-ink);border-radius:8px;padding:7px 10px;word-break:break-word}
.fnote b{font-weight:600}
body.nonotes .fnote,body.nonotes .side{display:none}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.streak{display:flex;align-items:center;gap:12px}
.streak strong{font:750 34px/1 var(--f-display)}
.dots{display:flex;gap:5px}
.dots span{width:24px;height:24px;border-radius:7px;background:var(--soft);font:600 10px/24px var(--f-mono);text-align:center;color:var(--mute)}
.dots span.y{background:var(--accent);color:var(--accent-ink)}
.dots span.t{background:transparent;border:1.5px dashed var(--accent);line-height:21px}
.pill{display:inline-block;font:600 11px var(--f-mono);border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* tab bar */
.tabbar{display:flex;border-top:1.5px solid var(--line);background:var(--card);position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar button{flex:1;border:none;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute);cursor:pointer;position:relative}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font:700 10px/16px var(--f-mono);min-width:16px;height:16px;border-radius:8px;padding:0 4px}

/* flow */
.ftop{display:flex;align-items:center;gap:12px;padding:12px 20px 4px}
.back{border:none;background:none;font-size:24px;line-height:1;cursor:pointer;padding:4px 6px;color:var(--ink)}
.prog{flex:1;height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font:600 12px var(--f-mono);color:var(--mute);min-width:34px;text-align:right}
.ffoot{position:sticky;bottom:0;background:var(--paper);padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--soft);z-index:4}
.ffoot .btn{flex:1}
.ffoot .btn.skip{flex:0 0 auto;min-width:90px}
.srcpick{display:flex;flex-direction:column;gap:8px}
.srcpick button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer}
.srcpick button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.srcpick small{color:var(--mute);display:block;font-size:13px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px 6px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.sum{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.sum b{display:block;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:3px}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:30px 24px}
.done .big{font:750 64px/1 var(--f-display);color:var(--accent)}

/* recall */
.rcard{background:var(--card);border:1.5px solid var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--soft)}
.reveal{font:600 20px/1.35 var(--f-display);letter-spacing:-.01em;margin:0}
.hidden-idea{border:1.5px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--mute)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{border:1.5px solid var(--line);border-radius:14px;padding:12px 4px 10px;background:var(--card);cursor:pointer;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center}
.grade button small{font:500 11px var(--f-mono);color:var(--mute)}
.grade .g-ok.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grade .g-fz.on{background:var(--fuzzy-soft);border-color:var(--fuzzy);color:var(--fuzzy)}
.grade .g-fg.on{background:var(--forgot-soft);border-color:var(--forgot);color:var(--forgot)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.tile strong{display:block;font:750 26px/1.1 var(--f-display)}
.tile span{font-size:12px;color:var(--mute)}

/* library */
.list{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;cursor:pointer;width:100%}
.srow .t{font-weight:700;font-size:15.5px;line-height:1.3}
.srow .m{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.scrim{position:absolute;inset:0;background:var(--shadow);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;border-top:1.5px solid var(--line);padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.tl{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--soft);margin-left:6px;padding-left:14px}
.tl div{position:relative;font-size:14px}
.tl div::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl b{font:600 12px var(--f-mono);color:var(--mute);display:block}
blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;font-style:italic}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--mute)}
.stars button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:440px){.scrim{position:fixed}}

/* history */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font:600 11px var(--f-mono);color:var(--mute);padding:4px 0}
.cal button{aspect-ratio:1;max-width:100%;border:none;background:none;border-radius:11px;cursor:pointer;font:600 13px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink)}
.cal button i{width:6px;height:6px;border-radius:50%;display:block}
.cal button.full i{background:var(--accent)}
.cal button.quick i{border:1.5px solid var(--accent)}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal button.sel{background:var(--accent-soft)}
.cal button:disabled{color:var(--line);cursor:default}
.hit{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;width:100%}
.hit small{color:var(--mute);font-size:12.5px}
mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,180px);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;font:12.5px/1.55 var(--f-mono);transition:transform .3s;width:max-content;max-width:calc(100% - 32px);z-index:80;visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}
</style>
</head>

<div class="proto">
  <a href="index.html">← <span class="long">All prototypes</span></a>
  <span class="name">B · Guided capture</span>
  <div class="tabs" id="ptabs">
    <button data-go="connect">Connect</button><button data-go="today">Today</button><button data-go="log">Log</button>
    <button data-go="library">Library</button><button data-go="review">Review</button><button data-go="history">History</button>
  </div>
  <div class="opts"><button id="notesBtn" aria-pressed="true">Notes on</button><button id="themeBtn">◐ auto</button></div>
</div>

<div class="stage">
  <div class="phone"><div class="phone-in" id="phoneIn">
    <div class="status"><span>21:40</span><span>bookjournal</span><span>87%</span></div>
    <main id="app"></main>
    <nav class="tabbar" id="tabbar">
      <button data-go="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>Today</button>
      <button data-go="library"><svg viewBox="0 0 24 24"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.5-1 2.5 15.5-3.5 1z"/></svg>Library</button>
      <button data-go="review"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>Review<span class="badge">4</span></button>

    </nav>
  </div></div>
  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast" role="status"></div>

const SRC={
  pm:{id:'books/the-patient-mind',slug:'the-patient-mind',type:'book',title:'The Patient Mind',author:'Ana Ferreira',status:'reading',pages:312,page:142,pct:46,last:'18 Nov',entries:6,ideas:9,topics:['focus','habits']},
  st:{id:'courses/intro-to-statistics',slug:'intro-to-statistics',type:'course',title:'Intro to Statistics',author:'Online course',status:'reading',prog:'Week 3 of 8',pct:38,last:'16 Nov',entries:3,ideas:5,topics:['statistics']},
  nc:{id:'books/notes-on-craft',slug:'notes-on-craft',type:'book',title:'Notes on Craft',author:'Ruth Abara',status:'want',last:'added 17 Nov',entries:0,ideas:0,topics:['writing']},
  lc:{id:'books/the-long-commute',slug:'the-long-commute',type:'book',title:'The Long Commute',author:'Tomas Lind',status:'finished',rating:4,last:'30 Oct',entries:11,ideas:14,topics:['cities','systems'],
      takeaway:'Busy systems push back. Every fix that makes something easier (a wider road, a faster queue) invites more of the thing it was meant to relieve. Before I add capacity anywhere, at work or at home, I now ask what demand it will create.'},
  fg:{id:'books/field-guide-to-clouds',slug:'field-guide-to-clouds',type:'book',title:'Field Guide to Clouds',author:'Ines Halvorsen',status:'abandoned',page:60,pages:240,last:'4 Oct',entries:2,ideas:2,topics:['weather'],reason:'Lovely photos, but I wanted the physics.'},
  ck:{id:'articles/2026/why-checklists-beat-willpower',slug:'why-checklists-beat-willpower',type:'article',title:'Why Checklists Beat Willpower',author:'Field Notes (blog)',status:'finished',last:'17 Nov',entries:1,ideas:1,topics:['habits','work']},
  ll:{id:'podcasts/2026/learning-loop-41-spacing',slug:'learning-loop-41-spacing',type:'podcast',title:'The Learning Loop · Ep. 41: Spacing and forgetting',author:'The Learning Loop',status:'finished',last:'15 Nov',entries:1,ideas:2,topics:['memory']},
  br:{id:'videos/2026/how-bridges-carry-load',slug:'how-bridges-carry-load',type:'video',title:'How bridges carry load',author:'Lecture',status:'finished',last:'13 Nov',entries:1,ideas:1,topics:['engineering']},
  jo:{id:'conversations/2026/coffee-with-jo',slug:'coffee-with-jo',type:'conversation',title:'Coffee with Jo (mentor)',author:'Conversation',status:'finished',last:'10 Nov',entries:1,ideas:1,topics:['work']},
};
const IDEAS={
  k7f2:{t:'Attention is a budget: every notification spends a little, even the ones I ignore.',s:'pm',d:'18 Nov',w:'Ch. 6 The attention budget'},
  p2d8:{t:'Deep work needs a start ritual more than it needs willpower.',s:'pm',d:'18 Nov',w:'Ch. 6 The attention budget'},

  'r-retire'(){const id=RECALL[S.rv.i].id;S.rv.retired[id]?delete S.rv.retired[id]:S.rv.retired[id]=1;render()},
  'r-back'(){if(S.rv.i===0)S.rv.started=false;else{S.rv.i--;S.rv.revealed=true}render()},
  'r-next'(){const R=S.rv;const id=RECALL[R.i].id;if(!R.grade[id]&&!R.retired[id])return;if(R.i+1<RECALL.length){R.i++;R.revealed=false;render()}else{R.finished=true;render();toast('recall: 4 ideas · 2026-11-19<br>reviews/recall/2026/2026-11.md · .journal/recall.json')}},
  'w-next'(){S.rv.wk.step=Math.min(WSTEPS,S.rv.wk.step+1);render();$('#app').scrollTop=0},
  'w-back'(){S.rv.wk.step--;render()},
  'w-top'(v){const t=S.rv.wk.top;t.includes(v)?t.splice(t.indexOf(v),1):t.length<3&&t.push(v);render()},
  'w-nextsrc'(v){S.rv.wk.next=v;render()},
  'w-swap'(){S.rv.wk.q=(S.rv.wk.q+1)%WQ.length;render()},
  'w-save'(){S.rv.wk.saved=true;render();toast('weekly review: 2026-W47<br>reviews/weekly/2026/2026-W47.md · .journal/followups.json')},
  day(v){S.hist.day=+v;S.hist.open=null;S.hist.q='';render()},
  hit(v){const H=S.hist;const q=H.q.trim().toLowerCase();H.open=corpus().filter(c=>c.text.toLowerCase().includes(q)||c.meta.toLowerCase().includes(q))[+v];render()},
  'close-hit'(){S.hist.open=null;render()},
  'hit-src'(){const s=S.hist.open.src;const k=Object.keys(SRC).find(k=>SRC[k]===s);S.hist.open=null;S.hist.q='';Object.assign(S.lib,{open:k,mode:'detail',filter:'all'});go('library')},
  'toast-month'(){toast('October 2026 · 24 days logged')},'toast-fu'(){toast('Follow-ups list: open, upcoming and closed, with what happened')},
  'toast-edit'(){toast('Edit opens the same step flow, pre-filled. Changed elsewhere? You see both versions.')},'toast-gh'(){toast('Opens the file in github.com/infinitepal178/bookjournal-data')},
};
document.addEventListener('click',e=>{
  const goEl=e.target.closest('[data-go]');if(goEl){if(goEl.dataset.go==='log')startLog(false,0);else{if(goEl.dataset.go==='review'&&goEl.closest('#app'))S.rv.tab='recall';go(goEl.dataset.go)}return}
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.classList.contains('scrim')&&e.target.closest('[data-stop]'))return;
  const f=ACT[el.dataset.act];if(f)f(el.dataset.v);
});
$('#notesBtn').onclick=()=>{S.notes=!S.notes;document.body.classList.toggle('nonotes',!S.notes);$('#notesBtn').textContent='Notes '+(S.notes?'on':'off');$('#notesBtn').setAttribute('aria-pressed',S.notes)};
const THEMES=['auto','light','dark'];let ti=0;
$('#themeBtn').onclick=()=>{ti=(ti+1)%3;const t=THEMES[ti];if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;$('#themeBtn').textContent='◐ '+t};
const fromHash=()=>{const h=location.hash.slice(1);return VIEWS[h]?h:'today'};
window.addEventListener('hashchange',()=>{const h=fromHash();if(h!==S.screen)go(h,false)});
S.screen=fromHash();render();
</script>
