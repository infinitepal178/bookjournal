<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commitments tab options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: one phone-width column (the app's own look); option switcher on top; each option is a mock of the new tab. */
:root{
  --bg:#e9eeeb; --card:#fbfcfb; --ink:#15201d; --mute:#5a6964; --line:#cdd7d3; --soft:#e1e8e5;
  --accent:#0d6a5b; --on-accent:#fff; --accent-soft:#d5eae3;
  --ok:#2a7a4c; --ok-soft:#dcefe3; --mid:#8f5f00; --mid-soft:#f6ebd2; --bad:#a63c39; --bad-soft:#f6dedd;
  --bar:#15201d; --bar-ink:#e6eeeb; --bar-mute:#93a49d;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --card:#17211e; --ink:#e6eeeb; --mute:#98a9a2; --line:#2e3c37; --soft:#212d29;
  --accent:#5cc4ad; --on-accent:#06211c; --accent-soft:#1d3a33;
  --ok:#74d09c; --ok-soft:#1c3427; --mid:#e2b45a; --mid-soft:#382d16; --bad:#f08a85; --bad-soft:#3c2120;
  --bar:#070b0a; --bar-ink:#e6eeeb; --bar-mute:#7f918a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --card:#17211e; --ink:#e6eeeb; --mute:#98a9a2; --line:#2e3c37; --soft:#212d29;
  --accent:#5cc4ad; --on-accent:#06211c; --accent-soft:#1d3a33;
  --ok:#74d09c; --ok-soft:#1c3427; --mid:#e2b45a; --mid-soft:#382d16; --bad:#f08a85; --bad-soft:#3c2120;
  --bar:#070b0a; --bar-ink:#e6eeeb; --bar-mute:#7f918a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.top small{color:var(--bar-mute);font-size:12.5px}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.top .seg button{border:1px solid var(--bar-mute);background:transparent;color:var(--bar-ink);border-radius:10px;padding:7px 6px;font-size:13.5px;font-weight:600;cursor:pointer;line-height:1.2}
.top .seg button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
main{max-width:560px;margin:0 auto;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.pitch{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
.pitch b{font-family:var(--display)}
.pitch ul{margin:6px 0 0;padding-left:18px}
.kicker{font:600 12px/1.4 var(--font);text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
h1{font:750 30px/1.12 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 12.5px/1.4 var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:6px 0 0}
.q{font:750 26px/1.15 var(--display);letter-spacing:-.02em;margin:4px 0 6px;text-wrap:balance}
.muted{color:var(--mute)} .small{font-size:14.5px} .tiny{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.sum b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.sum span{font-size:11.5px;color:var(--mute);line-height:1.2;display:block}
.sum.late b{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.item{display:flex;flex-direction:column;gap:6px;cursor:pointer;width:100%;text-align:left}
.item.open-item{border-color:var(--accent)}
.kind{display:inline-block;font:700 11px/1.6 var(--font);letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:0 6px;background:var(--soft);color:var(--mute)}
.kind.start{background:var(--accent-soft);color:var(--accent)}
.kind.stop{background:var(--bad-soft);color:var(--bad)}
.txt{font-weight:650;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--mute)}
.late{color:var(--bad);font-weight:600}
.renew{font-size:12.5px;font-weight:600;color:var(--accent)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.d{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid var(--line)}
.d.full{background:var(--ok);border-color:var(--ok)} .d.partial{background:linear-gradient(90deg,var(--mid) 50%,transparent 50%);border-color:var(--mid)} .d.none{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14.5px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.full[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--card)}
.chip.partial[aria-pressed="true"]{background:var(--mid);border-color:var(--mid);color:var(--card)}
.chip.none[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--card)}
.label{font:600 12px/1.4 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.input{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:650;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.panel{border-top:1px solid var(--soft);margin-top:8px;padding-top:12px;display:flex;flex-direction:column;gap:10px;cursor:default}
.choice{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.choice b{font-weight:700}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.closed{opacity:.85}
.status{font:700 11px/1.6 var(--font);text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:1px 8px;white-space:nowrap}
.st-full{background:var(--ok-soft);color:var(--ok)} .st-partial{background:var(--mid-soft);color:var(--mid)} .st-none{background:var(--bad-soft);color:var(--bad)} .st-habit{background:var(--accent-soft);color:var(--accent)}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
/* B: 15-day strip */
.strip{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px}
.day{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px 0 5px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .w{font-size:9.5px;color:var(--mute);text-transform:uppercase}
.day .n{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.day i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.day i.no{background:transparent}
.day.today{border-color:var(--accent);border-width:2px}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] .w{color:var(--on-accent)}
.day[aria-pressed="true"] i{background:var(--on-accent)}
.progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);transition:width .25s}
.big3{display:grid;gap:8px}
.big3 button{min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:17px;cursor:pointer}
.big3 .full[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.big3 .partial[aria-pressed="true"]{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.big3 .none[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* C: habit grid */
.grid{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px}
.cell{aspect-ratio:1/1;border-radius:6px;border:1px solid var(--soft);background:transparent;padding:0;display:grid;place-items:center;font-size:10px;color:var(--mute);min-width:0}
.cell.sched{border:1.5px dashed var(--accent)}
.cell.full{background:var(--ok);border-color:var(--ok)}
.cell.partial{background:var(--mid);border-color:var(--mid)}
.cell.none{background:var(--bad-soft);border-color:var(--bad)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px;cursor:pointer}
.gridhead{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;font-size:9.5px;color:var(--mute);text-align:center}
.meter{display:flex;align-items:center;gap:8px;font-size:13px}
.meter .progress{flex:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(520px,calc(100vw - 32px));width:max-content;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;z-index:20}
.file{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border-radius:10px;padding:8px 10px;color:var(--mute);overflow-wrap:anywhere}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="row" style="justify-content:space-between"><b>New tab: Commitments</b><small>made-up sample data · nothing is saved</small></div>
    <div class="seg" role="group" aria-label="Option">
      <button data-opt="a" aria-pressed="true">A · One list</button>
      <button data-opt="b" aria-pressed="false">B · Review flow</button>
      <button data-opt="c" aria-pressed="false">C · Habit board</button>
    </div>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- dates relative to today, so the mock always looks current ----------
const T = new Date(); T.setHours(12,0,0,0);
const day = (n) => { const d = new Date(T); d.setDate(d.getDate()+n); return d; };
const DN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = (n) => { const d = day(n); return `${DN[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}`; };
const when = (n) => n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : fmt(n);
const gapWord = (n) => n === 1 ? 'every day' : n === 7 ? 'every week' : n === 14 ? 'every 2 weeks' : `every ${n} days`;
const RES = { full: 'Fully', partial: 'Partly', none: 'Not at all' };

// ---------- made-up commitments (from "stop" / "start" lines and weekly reviews) ----------
const SEED = [
  { id: 1, kind: 'stop',  text: 'Checking chat in the first hour of work', src: 'The Patient Mind', made: -9, due: -2 },
  { id: 2, kind: 'start', text: 'A 4-line pre-send checklist for client emails', src: 'Why Checklists Beat Willpower', made: -7, due: -1 },
  { id: 3, kind: 'start', text: 'Phone in another room for the first hour', src: 'The Patient Mind', made: -9, due: 0, repeat: 3, checks: [[-6,'full'],[-3,'partial']] },
  { id: 4, kind: 'start', text: 'Walk without headphones once a day', src: 'The Patient Mind', made: -5, due: 2 },
  { id: 5, kind: 'start', text: '5-minute pre-mortem in Tuesday planning', src: 'Coffee with Jo', made: -24, due: 4, repeat: 7, checks: [[-17,'full'],[-10,'full'],[-3,'full']] },
  { id: 6, kind: 'stop',  text: 'Reading email before breakfast', src: 'Weekly review, week 47', made: -5, due: 6 },
  { id: 7, kind: 'start', text: 'Recall before re-reading', src: 'The Learning Loop · Ep. 41', made: -3, due: 11 },
  { id: 8, kind: 'start', text: 'Explain one idea a week to someone', src: 'Weekly review, week 48', made: -1, due: 19 },
  { id: 9, kind: 'start', text: 'Same 3-step start every morning', src: 'The Patient Mind', made: -20, closed: -6, result: 'full', note: '5 of 7 days.' },
  { id: 10, kind: 'stop', text: 'Assuming more capacity fixes a busy calendar', src: 'The Long Commute', made: -45, closed: -20, result: 'none', note: 'Said yes to two extra meetings.' },
  { id: 11, kind: 'start', text: 'Monthly coffee with Jo', src: 'Coffee with Jo', made: -60, closed: -8, result: 'habit', note: '3 months in a row. It sticks now.', checks: [[-60,'full'],[-30,'full'],[-8,'full']] },
];
let items = JSON.parse(JSON.stringify(SEED));
let opt = 'a';
const state = { a: { open: null, ans: {} }, b: { mode: 'home', sel: null, queue: [], i: 0, ans: {} }, c: { tab: 'habits', ans: {} } };

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const isOpen = (x) => x.closed === undefined;
const verb = (x) => (x.kind === 'stop' ? 'Did you stop ' : 'Did you ') + x.text.charAt(0).toLowerCase() + x.text.slice(1) + '?';
const dotsOf = (x) => (x.checks || []).map(([, r]) => `<i class="d ${r}" title="${RES[r] || r}"></i>`).join('');
const groups = () => {
  const open = items.filter(isOpen);
  return {
    late: open.filter((x) => x.due < 0).sort((a, b) => a.due - b.due),
    today: open.filter((x) => x.due === 0),
    soon: open.filter((x) => x.due > 0 && x.due <= 15).sort((a, b) => a.due - b.due),
    later: open.filter((x) => x.due > 15),
    renewing: open.filter((x) => x.repeat),
    closed: items.filter((x) => !isOpen(x)).sort((a, b) => b.closed - a.closed),
  };
};
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3200); }

/** Apply an answer: how it went, then resolve / remind again / always renew. */
function apply(x, a) {
  x.checks = [...(x.checks || []), [0, a.result]];
  if (a.next === 'resolve') { x.closed = 0; x.result = a.result; x.note = a.note; delete x.repeat; return `Resolved: ${RES[a.result]}. Closed for good.`; }
  if (a.next === 'habit') { x.closed = 0; x.result = 'habit'; x.note = a.note; delete x.repeat; return 'Marked as a habit. No more reminders.'; }
  if (a.next === 'again') { x.due = a.days; return `${RES[a.result]}. I'll ask again ${when(a.days)}.`; }
  x.repeat = a.days; x.due = a.days; return `${RES[a.result]}. Renews ${gapWord(a.days)}: next ${when(a.days)}.`;
}

// ---------- shared answer panel ----------
function answerPanel(x, a, key, withResult = true) {
  const renewing = !!x.repeat;
  const nexts = renewing
    ? [['renew', 'Keep renewing', `Ask again ${gapWord(x.repeat)}.`], ['habit', "It's a habit now", 'Stop the reminders and file it under habits.'], ['resolve', 'Resolve it', 'Close it for good.']]
    : [['resolve', 'Resolve it', 'A one-time thing. Close it.'], ['again', 'Remind me once more', 'Ask me one more time, then decide.'], ['renew', 'Always renew', 'Keep asking until it becomes a habit.']];
  const daysFor = a.next === 'again' ? [1, 3, 7, 14] : [1, 3, 7];
  return `
    ${withResult ? `<div class="label">How did it go?</div>
    <div class="chips" role="group" aria-label="How did it go?">
      ${['full', 'partial', 'none'].map((r) => `<button class="chip ${r}" data-k="${key}" data-f="result" data-v="${r}" aria-pressed="${a.result === r}">${r === 'full' ? 'Full' : r === 'partial' ? 'Partial' : 'None'}</button>`).join('')}
    </div>` : ''}
    ${a.result ? `
    <input class="input" data-k="${key}" data-f="note" placeholder="What happened? (optional)" value="${esc(a.note || '')}" aria-label="What happened?">
    <div class="label">What next?</div>
    <div class="stack" style="gap:6px">
      ${nexts.map(([v, t, d]) => `<button class="choice" data-k="${key}" data-f="next" data-v="${v}" aria-pressed="${a.next === v}"><b>${t}</b><span class="tiny muted">${d}</span></button>`).join('')}
    </div>
    ${a.next === 'again' || a.next === 'renew' ? `<div class="chips" role="group" aria-label="When">
      ${daysFor.map((n) => `<button class="chip" data-k="${key}" data-f="days" data-v="${n}" aria-pressed="${a.days === n}">${a.next === 'renew' ? gapWord(n).replace(/^e/, 'E') : 'In ' + (n === 1 ? '1 day' : n === 7 ? 'a week' : n === 14 ? '2 weeks' : n + ' days')}</button>`).join('')}
    </div>` : ''}` : ''}`;
}
const ready = (a) => a && a.result && a.next && (a.next === 'resolve' || a.next === 'habit' || a.days);
const defaults = (x) => ({ next: x.repeat ? 'renew' : undefined, days: x.repeat });

// ---------- Option A: one list ----------
function renderA() {
  const g = groups(), s = state.a;
  const row = (x) => {
    const open = s.open === x.id, a = s.ans[x.id] || defaults(x);
    const dueTxt = x.due < 0 ? `<span class="late">was due ${when(x.due)} · unresolved</span>` : `ask ${when(x.due)}`;
    return `<div class="card item ${open ? 'open-item' : ''}" data-row="${x.id}">
      <div class="spread"><span><span class="kind ${x.kind}">${x.kind}</span> ${x.repeat ? `<span class="renew">↻ ${gapWord(x.repeat)}</span>` : ''}</span><span class="dots">${dotsOf(x)}</span></div>
      <div class="txt">${esc(x.text)}</div>
      <div class="meta">from ${esc(x.src)} · ${dueTxt}</div>
      ${open ? `<div class="panel" data-stop>${answerPanel(x, a, x.id)}
        <button class="btn primary" data-save="${x.id}" ${ready(a) ? '' : 'disabled'}>Save</button></div>` : ''}
    </div>`;
  };
  const closedRow = (x) => `<div class="card closed"><div class="spread"><div><span class="kind ${x.kind}">${x.kind}</span> <span class="txt">${esc(x.text)}</span></div><span class="status st-${x.result}">${x.result === 'habit' ? 'Habit' : RES[x.result]}</span></div>
    ${x.note ? `<div class="small" style="margin-top:4px">${esc(x.note)}</div>` : ''}<div class="meta">closed ${when(x.closed)} · from ${esc(x.src)}</div></div>`;
  return `
  <div class="pitch"><b>A · One list.</b> A new tab with every commitment in one scrolling list, grouped by when it's due. Tap one to answer it right there.
    <ul><li>Quickest to scan; nothing hidden</li><li>Least to build</li><li>Answering several in a row means more taps</li></ul></div>
  <div><span class="kicker">Commitments</span><h1>What you said you'd do</h1></div>
  <div class="summary">
    <div class="sum late"><b>${g.late.length}</b><span>unresolved</span></div>
    <div class="sum"><b>${g.today.length}</b><span>due today</span></div>
    <div class="sum"><b>${g.soon.length}</b><span>next 15 days</span></div>
    <div class="sum"><b>${g.renewing.length}</b><span>renewing</span></div>
  </div>
  ${g.late.length ? `<h2>Unresolved</h2>${g.late.map(row).join('')}` : ''}
  ${g.today.length ? `<h2>Due today</h2>${g.today.map(row).join('')}` : ''}
  <h2>Next 15 days · to ${fmt(15)}</h2>${g.soon.length ? g.soon.map(row).join('') : '<p class="small muted">Nothing due.</p>'}
  ${g.later.length ? `<h2>Later</h2>${g.later.map(row).join('')}` : ''}
  <h2>Closed</h2>${g.closed.map(closedRow).join('')}
  <div class="file">Saved to <b>.journal/followups.json</b> and <b>followups.md</b>, one commit per Save.</div>`;
}

// ---------- Option B: review flow ----------
function renderB() {
  const g = groups(), s = state.b;
  if (s.mode === 'flow') {
    const x = items.find((y) => y.id === s.queue[s.i]);
    const a = s.ans[x.id] || (s.ans[x.id] = defaults(x));
    return `
    <div class="row" style="flex-wrap:nowrap"><button class="btn" style="min-height:40px;padding:0 12px" data-bquit>×</button><div class="progress" style="flex:1"><b style="width:${((s.i + 1) / s.queue.length) * 100}%"></b></div><span class="tiny muted">${s.i + 1}/${s.queue.length}</span></div>
    <div class="meta"><span class="kind ${x.kind}">${x.kind}</span> from ${esc(x.src)} · ${x.due < 0 ? `<span class="late">${-x.due} day${x.due === -1 ? '' : 's'} late</span>` : 'due today'}${x.repeat ? ` · <span class="renew">↻ ${gapWord(x.repeat)}</span> <span class="dots">${dotsOf(x)}</span>` : ''}</div>
    <p class="q">${esc(verb(x))}</p>
    <div class="big3" role="group" aria-label="How did it go?">
      ${['full', 'partial', 'none'].map((r) => `<button class="${r}" data-k="${x.id}" data-f="result" data-v="${r}" aria-pressed="${a.result === r}">${r === 'full' ? 'Yes, fully' : r === 'partial' ? 'Partly' : 'Not at all'}</button>`).join('')}
    </div>
    ${a.result ? `<div class="panel" style="border:0;padding-top:0;margin-top:0">${answerPanel(x, a, x.id, false)}</div>` : ''}
    <button class="btn primary wide" data-bnext ${ready(a) ? '' : 'disabled'}>${s.i + 1 < s.queue.length ? 'Next' : 'Save all'}</button>`;
  }
  if (s.mode === 'done') return `<div class="card stack" style="text-align:center;padding:28px 16px"><div style="font:800 56px/1 var(--display);color:var(--accent)">✓</div><h1>Reviewed ${s.queue.length}</h1><p class="small muted" style="margin:0">Saved in one commit. Next one is due ${when(Math.min(...items.filter(isOpen).map((x) => x.due)))}.</p><button class="btn" data-bhome>Back</button></div>`;
  const dueQ = [...g.late, ...g.today];
  const sel = s.sel;
  const list = sel === null ? g.soon : items.filter((x) => isOpen(x) && x.due === sel);
  return `
  <div class="pitch"><b>B · Review flow.</b> The tab opens on your next 15 days. One button walks you through everything that's due, one commitment per screen, like logging a learning.
    <ul><li>Fastest when several are due at once</li><li>Matches how you log</li><li>The full list sits below the strip, not first</li></ul></div>
  <div><span class="kicker">Commitments</span><h1>Your next 15 days</h1></div>
  <div class="strip" role="group" aria-label="Next 15 days">
    ${Array.from({ length: 15 }, (_, i) => { const n = items.filter((x) => isOpen(x) && x.due === i).length; const d = day(i);
      return `<button class="day ${i === 0 ? 'today' : ''}" data-day="${i}" aria-pressed="${sel === i}" aria-label="${fmt(i)}: ${n} due"><span class="w">${DN[d.getDay()].slice(0, 1)}</span><span class="n">${d.getDate()}</span><i class="${n ? '' : 'no'}"></i></button>`; }).join('')}
  </div>
  ${dueQ.length ? `<div class="card stack"><div><b style="font-family:var(--display);font-size:20px">${dueQ.length} to review now</b><div class="small muted">${g.late.length} unresolved, ${g.today.length} due today · about 1 min</div></div>
    <button class="btn primary wide" data-bstart>Review ${dueQ.length} now</button></div>` : '<div class="card small muted">Nothing due right now.</div>'}
  <div class="spread"><h2>${sel === null ? 'Coming up' : 'Due ' + when(sel)}</h2>${sel !== null ? '<button class="chip" data-day="clear">Show all</button>' : ''}</div>
  ${list.length ? list.map((x) => `<div class="card"><span class="kind ${x.kind}">${x.kind}</span> <span class="txt">${esc(x.text)}</span>${x.repeat ? ` <span class="renew">↻ ${gapWord(x.repeat)}</span>` : ''}<div class="meta">from ${esc(x.src)} · ask ${when(x.due)}</div></div>`).join('') : '<p class="small muted">Nothing due that day.</p>'}
  <h2>Closed</h2>${g.closed.map((x) => `<div class="card spread closed"><span class="small"><span class="kind ${x.kind}">${x.kind}</span> ${esc(x.text)}</span><span class="status st-${x.result}">${x.result === 'habit' ? 'Habit' : RES[x.result]}</span></div>`).join('')}`;
}

// ---------- Option C: habit board ----------
function renderC() {
  const g = groups(), s = state.c;
  const habits = g.renewing, once = items.filter((x) => isOpen(x) && !x.repeat).sort((a, b) => a.due - b.due);
  const head = `<div class="gridhead">${Array.from({ length: 15 }, (_, i) => `<span>${i === 7 ? '<b>T</b>' : day(i - 7).getDate()}</span>`).join('')}</div>`;
  const habitCard = (x) => {
    const checks = Object.fromEntries((x.checks || []).map(([o, r]) => [o, r]));
    const sched = new Set(); for (let o = x.due; o <= 7; o += x.repeat) sched.add(o);
    const full = (x.checks || []).filter(([, r]) => r === 'full').length, tot = (x.checks || []).length;
    const streak = (() => { let n = 0; for (const [, r] of [...(x.checks || [])].reverse()) { if (r === 'full') n++; else break; } return n; })();
    const a = s.ans[x.id];
    return `<div class="card stack" style="gap:8px">
      <div class="spread"><span><span class="kind ${x.kind}">${x.kind}</span> <span class="renew">↻ ${gapWord(x.repeat)}</span></span><span class="tiny muted">${full}/${tot} full</span></div>
      <div class="txt">${esc(x.text)}</div>
      ${head}
      <div class="grid">${Array.from({ length: 15 }, (_, i) => { const o = i - 7, r = checks[o];
        const cls = r ? r : sched.has(o) ? 'sched' : ''; const today = o === 0 && x.due <= 0;
        return `<span class="cell ${cls} ${today ? 'today' : ''}" ${today ? 'title="Today: answer below"' : ''}>${today && !r ? '?' : ''}</span>`; }).join('')}</div>
      <div class="meter"><span>${streak} full in a row</span><div class="progress"><b style="width:${Math.min(100, (streak / 5) * 100)}%"></b></div><span>${streak >= 5 ? 'habit?' : `${5 - streak} to go`}</span></div>
      ${x.due <= 0 || a ? `<div class="panel" data-stop>${answerPanel(x, a || (s.ans[x.id] = defaults(x)), x.id)}<button class="btn primary" data-save="${x.id}" ${ready(s.ans[x.id]) ? '' : 'disabled'}>Save</button></div>` : `<div class="meta">next check ${when(x.due)}</div>`}
    </div>`;
  };
  const onceCard = (x) => {
    const a = s.ans[x.id];
    return `<div class="card stack" style="gap:6px">
      <div class="spread"><span class="kind ${x.kind}">${x.kind}</span><span class="tiny ${x.due < 0 ? 'late' : 'muted'}">${x.due < 0 ? 'unresolved · ' + when(x.due) : when(x.due)}</span></div>
      <div class="txt">${esc(x.text)}</div><div class="meta">from ${esc(x.src)}</div>
      ${x.due <= 0 || a ? `<div class="panel" data-stop>${answerPanel(x, a || (s.ans[x.id] = defaults(x)), x.id)}<button class="btn primary" data-save="${x.id}" ${ready(s.ans[x.id]) ? '' : 'disabled'}>Save</button></div>` : `<button class="chip" style="align-self:flex-start" data-early="${x.id}">Answer early</button>`}
    </div>`;
  };
  return `
  <div class="pitch"><b>C · Habit board.</b> Two halves: <b>Habits</b> you renew get a 15-day grid (last 7 days, today, next 7) and a streak toward "it's a habit now"; <b>One-time</b> things are a simple dated list.
    <ul><li>Shows whether a habit is actually sticking</li><li>Best if most of your commitments repeat</li><li>Most to build; one-time things get less room</li></ul></div>
  <div><span class="kicker">Commitments</span><h1>Habits and one-time things</h1></div>
  <div class="halves" role="group" aria-label="Show">
    <button class="chip" data-ctab="habits" aria-pressed="${s.tab === 'habits'}">Habits · ${habits.length}</button>
    <button class="chip" data-ctab="once" aria-pressed="${s.tab === 'once'}">One-time · ${once.length}</button>
  </div>
  ${s.tab === 'habits' ? `
    <div class="legend"><span><i class="d full"></i>full</span><span><i class="d partial"></i>partial</span><span><i class="d none"></i>none</span><span><i class="d" style="border:1.5px dashed var(--accent)"></i>check day</span><span>T = today</span></div>
    ${habits.map(habitCard).join('') || '<p class="small muted">No renewing commitments yet. Choose "Always renew" on any one-time thing.</p>'}
    <h2>Graduated habits</h2>${g.closed.filter((x) => x.result === 'habit').map((x) => `<div class="card spread closed"><span class="small">${esc(x.text)}</span><span class="status st-habit">Habit</span></div>`).join('') || '<p class="small muted">None yet.</p>'}`
  : `${once.map(onceCard).join('')}
    <h2>Closed</h2>${g.closed.filter((x) => x.result !== 'habit').map((x) => `<div class="card spread closed"><span class="small">${esc(x.text)}</span><span class="status st-${x.result}">${RES[x.result]}</span></div>`).join('')}`}`;
}

// ---------- wiring ----------
const app = document.getElementById('app');
function render() {
  app.innerHTML = opt === 'a' ? renderA() : opt === 'b' ? renderB() : renderC();
  document.querySelectorAll('[data-opt]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.opt === opt));
}
const ansStore = () => state[opt].ans;
app.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-row]'); if (!t) return;
  const d = t.dataset;
  if (d.f) { const st = ansStore(); const a = st[d.k] || (st[d.k] = defaults(items.find((x) => x.id == d.k)));
    a[d.f] = d.f === 'days' ? Number(d.v) : d.v; if (d.f === 'next' && (d.v === 'resolve' || d.v === 'habit')) delete a.days;
    if (d.f === 'next' && d.v === 'renew' && !a.days) a.days = 3; if (d.f === 'next' && d.v === 'again' && !a.days) a.days = 7; render(); return; }
  if (d.save) { const x = items.find((y) => y.id == d.save); toast(apply(x, ansStore()[x.id])); delete ansStore()[x.id]; state.a.open = null; render(); return; }
  if (d.row && !e.target.closest('[data-stop]')) { state.a.open = state.a.open == d.row ? null : Number(d.row); render(); return; }
  if ('bstart' in d) { const g = groups(); Object.assign(state.b, { mode: 'flow', queue: [...g.late, ...g.today].map((x) => x.id), i: 0, ans: {} }); render(); return; }
  if ('bnext' in d) { const s = state.b; if (s.i + 1 < s.queue.length) s.i++; else { s.queue.forEach((id) => apply(items.find((y) => y.id === id), s.ans[id])); s.mode = 'done'; } render(); window.scrollTo(0, 0); return; }
  if ('bquit' in d || 'bhome' in d) { state.b.mode = 'home'; render(); return; }
  if (d.day !== undefined) { state.b.sel = d.day === 'clear' || state.b.sel == d.day ? null : Number(d.day); render(); return; }
  if (d.ctab) { state.c.tab = d.ctab; render(); return; }
  if (d.early) { state.c.ans[d.early] = defaults(items.find((x) => x.id == d.early)); render(); return; }
});
app.addEventListener('input', (e) => { const d = e.target.dataset; if (d.f === 'note') { const st = ansStore(); (st[d.k] || (st[d.k] = {})).note = e.target.value; } });
document.querySelector('.top .seg').addEventListener('click', (e) => { const b = e.target.closest('[data-opt]'); if (!b) return; opt = b.dataset.opt; items = JSON.parse(JSON.stringify(SEED)); render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
